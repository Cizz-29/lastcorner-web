# Pipeline Telemetria — elabora automaticamente i dati dei weekend F1
# conclusi (via FastF1) e li committa come JSON statici in
# public/telemetria-data/. Il commit fa ripartire il deploy Vercel, che
# serve i file senza alcun backend.
#
# Gira nei weekend di gara (sab/dom sera UTC, dopo qualifica e gara) più un
# giro di recupero il lunedì. Si può anche lanciare a mano da GitHub →
# Actions → "Telemetria" → Run workflow, scegliendo il GP da un elenco.

name: Telemetria

on:
  schedule:
    - cron: '30 16,19,22 * * 6'   # sabato: dopo le qualifiche
    - cron: '30 16,19,22 * * 0'   # domenica: dopo la gara
    - cron: '30 8 * * 1'          # lunedì mattina: recupero
  workflow_dispatch:
    inputs:
      gp:
        description: 'Gran Premio da elaborare'
        required: true
        default: 'Automatico (ultimo weekend concluso)'
        type: choice
        options:
          - 'Automatico (ultimo weekend concluso)'
          - '1 - Australia (Melbourne)'
          - '2 - Cina (Shanghai)'
          - '3 - Giappone (Suzuka)'
          - '4 - Miami'
          - '5 - Canada (Montreal)'
          - '6 - Monaco'
          - '7 - Barcellona'
          - '8 - Austria (Spielberg)'
          - '9 - Gran Bretagna (Silverstone)'
          - '10 - Belgio (Spa)'
          - '11 - Ungheria (Budapest)'
          - '12 - Olanda (Zandvoort)'
          - '13 - Italia (Monza)'
          - '14 - Spagna (Madrid)'
          - '15 - Azerbaijan (Baku)'
          - '16 - Bahrain GP (Sepang)'
          - '17 - Singapore'
          - '18 - Stati Uniti (Austin)'
          - '19 - Messico'
          - '20 - Brasile (Interlagos)'
          - '21 - Las Vegas'
          - '22 - Qatar (Lusail)'
          - '23 - Abu Dhabi'
      year:
        description: 'Anno (lascia 2026 salvo stagioni passate)'
        required: false
        default: '2026'
      round:
        description: 'Round numerico — usato dal pannello sul sito, ha priorità sul menu'
        required: false

permissions:
  contents: write

concurrency:
  group: telemetria
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Lo script usa solo la libreria standard di Python: nessuna dipendenza
      # da installare. I dati arrivano dall'API pubblica OpenF1, che (a
      # differenza del live timing ufficiale F1) non blocca gli IP dei server.

      - name: Elabora dati
        env:
          GP_INPUT: ${{ inputs.gp }}
          YEAR_INPUT: ${{ inputs.year }}
          ROUND_INPUT: ${{ inputs.round }}
        run: |
          set -e
          # Il pannello sul sito passa direttamente "round"; dal menu a tendina
          # di GitHub si estrae invece il numero iniziale della voce scelta
          # (es. "11 - Ungheria (Budapest)" -> 11). Se manca entrambi (voce
          # "Automatico") decide lo script quale weekend elaborare.
          ROUND="$ROUND_INPUT"
          if [ -z "$ROUND" ]; then
            ROUND=$(echo "$GP_INPUT" | grep -oE '^[0-9]+' || true)
          fi
          YEAR="${YEAR_INPUT:-2026}"
          if [ -n "$ROUND" ]; then
            echo "Elaboro $YEAR round $ROUND"
            python scripts/telemetry/process_session.py "$YEAR" "$ROUND"
          else
            echo "Modalità automatica"
            python scripts/telemetry/process_session.py --auto
          fi

      - name: Commit dati aggiornati
        run: |
          # La cartella può non esistere se nessuna sessione ha prodotto dati:
          # senza questo controllo `git add` fallirebbe con exit 128.
          if [ ! -d public/telemetria-data ]; then
            echo "Nessun dato prodotto in questa esecuzione."
            exit 0
          fi
          git config user.name "telemetria-bot"
          git config user.email "actions@github.com"
          git add public/telemetria-data
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo."
          else
            git commit -m "Telemetria: dati aggiornati [skip ci]"
            git pull --rebase origin main
            git push
          fi
