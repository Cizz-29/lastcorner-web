# Telemetria automatica: dopo ogni sessione di un weekend di F1 (libere,
# qualifiche, sprint, gara) scarica i dati con FastF1, li scrive in
# public/telemetria-data/ e li committa. Il commit fa ripartire il deploy
# Vercel, che li pubblica sul sito.
#
# Come funziona:
#   1. ogni ora, da venerdi' a lunedi' (UTC), scripts/telemetry/
#      serve_aggiornare.py guarda il calendario e l'indice dei dati: se una
#      sessione e' finita da almeno 40 minuti e non e' ancora sul sito, dice
#      quale. Senza sessioni da fare il job finisce li', in pochi secondi.
#   2. solo allora si installa FastF1 e si elaborano QUELLE sessioni (non
#      tutto il weekend: le precedenti restano come sono).
#   3. se l'archivio F1 non ha ancora pubblicato i dati non si scrive nulla,
#      e l'ora dopo il controllo la ripropone.
#
# A mano: GitHub -> Actions -> "Telemetria" -> Run workflow, indicando il
# round (e, se si vuole, solo alcune sessioni, es. "Q,R").
#
# ATTENZIONE per chi lavora sul repository: questo workflow fa commit su
# main durante i weekend di gara. Prima di un push dal PC serve
#     git pull --rebase
# altrimenti il push viene rifiutato.

name: Telemetria

on:
  schedule:
    - cron: '20 * * * 5,6,0,1'
  workflow_dispatch:
    inputs:
      round:
        description: 'Round da elaborare (es. 16)'
        required: true
      sessioni:
        description: 'Solo queste sessioni, separate da virgola (es. Q,R). Vuoto = tutto il weekend'
        required: false
        default: ''
      anno:
        description: 'Anno'
        required: false
        default: '2026'

permissions:
  contents: write

# Mai due elaborazioni insieme: scriverebbero lo stesso index.json.
concurrency:
  group: telemetria
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cosa c'e' da fare
        id: controllo
        env:
          ROUND_INPUT: ${{ inputs.round }}
          SESSIONI_INPUT: ${{ inputs.sessioni }}
          ANNO_INPUT: ${{ inputs.anno }}
        run: |
          if [ -n "$ROUND_INPUT" ]; then
            echo "anno=${ANNO_INPUT:-2026}" >> "$GITHUB_OUTPUT"
            echo "round=$ROUND_INPUT" >> "$GITHUB_OUTPUT"
            echo "sessioni=$SESSIONI_INPUT" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/telemetry/serve_aggiornare.py >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.controllo.outputs.round != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/telemetry/requirements.txt

      - name: Installa FastF1
        if: steps.controllo.outputs.round != ''
        run: pip install -r scripts/telemetry/requirements.txt

      - name: Elabora
        if: steps.controllo.outputs.round != ''
        env:
          ANNO: ${{ steps.controllo.outputs.anno }}
          ROUND: ${{ steps.controllo.outputs.round }}
          SESSIONI: ${{ steps.controllo.outputs.sessioni }}
        run: |
          if [ -n "$SESSIONI" ]; then
            python scripts/telemetry/process_session.py "$ANNO" "$ROUND" --sessioni "$SESSIONI"
          else
            python scripts/telemetry/process_session.py "$ANNO" "$ROUND"
          fi

      - name: Commit
        if: steps.controllo.outputs.round != ''
        env:
          ROUND: ${{ steps.controllo.outputs.round }}
          SESSIONI: ${{ steps.controllo.outputs.sessioni }}
        run: |
          git config user.name "telemetria-bot"
          git config user.email "actions@github.com"
          git add public/telemetria-data
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo (archivio F1 non ancora aggiornato?)."
            exit 0
          fi
          # NIENTE "[skip ci]" nel messaggio: Vercel lo interpreta come "non
          # ricostruire" e i dati non arriverebbero mai sul sito. Non c'e'
          # rischio di cicli: il workflow parte da cron o a mano, mai da un push.
          git commit -m "Telemetria: round $ROUND ${SESSIONI:-weekend completo}"
          # Se nel frattempo qualcuno ha pushato, ci si rimette in coda.
          for tentativo in 1 2 3; do
            git fetch --depth=50 origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
